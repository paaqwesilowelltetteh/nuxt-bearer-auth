name: Nuxt compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nuxt-compatibility.yml'
      - 'scripts/test-nuxt-compatibility.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
      - 'vitest.config.ts'
  push:
    paths:
      - '.github/workflows/nuxt-compatibility.yml'
      - 'scripts/test-nuxt-compatibility.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  consumer-build:
    name: Nuxt ${{ matrix.nuxt }} on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nuxt: '3.12.0'
            node: '24.19.0'
          - nuxt: '3.21.11'
            node: '24.19.0'
          - nuxt: '4.6.1'
            node: '24.19.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the package-declared npm version
        run: |
          npm install --global npm@10.0.0
          test "$(node --version)" = "v${{ matrix.node }}"
          test "$(npm --version)" = "10.0.0"
      - name: Install module development dependencies
        run: npm ci --legacy-peer-deps
      - name: Build the distributable module
        run: npm run build
      - name: Pack the distributable module
        id: pack
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --ignore-scripts
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "archive=$RUNNER_TEMP/nuxt-bearer-auth-$PACKAGE_VERSION.tgz" >> "$GITHUB_OUTPUT"
      - name: Prepare and build the isolated consumer
        run: node scripts/test-nuxt-compatibility.mjs '${{ matrix.nuxt }}' '${{ matrix.node }}' '${{ steps.pack.outputs.archive }}'
